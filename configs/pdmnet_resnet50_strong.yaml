dataset:
  image_size: 224
  num_workers: 8
  class_names: []

training:
  epochs: 80
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.001
  optimizer: adamw
  scheduler: cosine
  seed: 0
  amp: true
  freeze_backbone: false

model:
  name: pdmnet
  backbone: resnet50
  pretrained: true
  feature_dim: 2048
  temperature: 0.1
  fusion_alpha: 0.7
  mask_scale: 5.0
  dropout: 0.35
  use_gt_mask_train: true
  use_prototype_mask: true
  use_prototype_classifier: true

loss:
  lambda_mask: 0.0005
  lambda_consistency: 0.05
  label_smoothing: 0.1
  use_fused_ce: true

output:
  root: outputs
  run_name: pdmnet_resnet50_strong
